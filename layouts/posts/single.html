<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabo Rocha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #F6F2EA; color: #2B2118; }
    .text-terra { color: #5C3A21; }
    .box-post { background-color: #FFFDF9; border: 2px solid #D5C5B3; }
    .conteudo-texto img { max-width: 100%; height: auto; border-radius: 8px; margin: 1rem 0; }
  </style>
</head>
<body>

  <nav class="navbar bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img src="/uploads/logo-antigo.png" alt="Logo ACBR" height="45">
        <span class="fw-bold text-terra">ACBR - Cabo Rocha</span>
      </a>
      <a href="/posts/" class="btn btn-outline-dark btn-sm">← Voltar para notícias</a>
    </div>
  </nav>

  <main class="container my-5" style="max-width: 800px;">
    <article class="box-post p-4 p-md-5 rounded">
      <small class="text-muted">Publicado em {{ .Date.Format "02/01/2006" }}</small>
      <h1 class="fw-bold text-terra mt-2 mb-3">{{ .Title }}</h1>
      
      {{ with .Params.image }}
        <img src="{{ . }}" class="img-fluid rounded mb-4 w-100" alt="{{ $.Title }}">
      {{ end }}

      <div class="conteudo-texto fs-5 lh-base">
        {{ .Content }}
      </div>
    </article>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/img/favicon.png">
  <title>Cabo Rocha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/css.css" rel="stylesheet"> 
</head>
<body>

  <nav class="navbar bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img src="/img/logo.png" alt="Logo ACBR" height="45">
        <span class="fw-bold text-terra">ACBR - Cabo Rocha</span>
      </a>
      <a href="/" class="btn btn-outline-dark btn-sm">← Início</a>
    </div>
  </nav>

  <main class="container my-5">
    <h1 class="fw-bold text-terra mb-4">Todas as Ações e Notícias</h1>
    <div class="row g-4">
      {{ range .Pages }}
      <div class="col-md-6">
        <div class="card card-custom p-3 h-100">
          {{ with .Params.image }}
            <img src="{{ . }}" class="card-img-top rounded mb-3" alt="Capa" style="height: 220px; object-fit: cover;">
          {{ end }}
          <div class="card-body p-0">
            <small class="text-muted">{{ .Date.Format "02/01/2006" }}</small>
            <h4 class="fw-bold text-terra mt-1">{{ .Title }}</h4>
            <p>{{ .Params.description }}</p>
            <a href="{{ .RelPermalink }}" class="btn btn-turquesa btn-sm">Ler publicação completa</a>
          </div>
        </div>
      </div>
      {{ end }}
    </div>
  </main>

</body>
</html>

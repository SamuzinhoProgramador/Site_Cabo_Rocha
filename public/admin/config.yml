backend:
  name: git-gateway
  branch: main

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Rascunho (Ocultar do site)", name: "draft", widget: "boolean", default: false}
      - {label: "Capa do Post", name: "image", widget: "image", required: false}
      - {label: "Corpo do Texto", name: "body", widget: "markdown"}